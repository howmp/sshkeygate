name: sshkeygate
description: "Secure SSH agent with approval policies and Bitwarden sync"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  cryptography: ^2.7.0
  crypto: ^3.0.0
  encrypt: ^5.0.3
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  window_manager: ^0.4.0
  uuid: ^4.5.0
  win32: ^5.0.0
  dart_ipc: ^1.0.1
  ffi: ^2.1.0
  pointycastle: ^3.9.1
  flutter_secure_storage: ^10.3.1
  system_tray: ^0.1.1
  dartssh2: ^2.11.0
  file_picker: ^11.0.2
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
