name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 180s

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # MyGo needs no cgo, so every target builds from any machine.
      - name: Build every target
        run: |
          # The macOS targets keep the deployment target the release uses.
          for target in windows/amd64 darwin/amd64 darwin/arm64; do
            echo "Building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

      - name: Check the macOS deployment target
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-macos 11.0" -o /tmp/mac11 .
          go run tools/machoinfo/main.go /tmp/mac11
