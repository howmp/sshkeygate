name: Release

# A tag such as v0.3.0 publishes a Windows executable and a macOS disk
# image holding a universal app (Apple Silicon and Intel).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, such as v0.3.0"
        required: true

permissions:
  contents: write

env:
  # TAG names the release and its tag, such as v0.3.0. VERSION is the same
  # number without the v, which is how mygo names its disk image; each job
  # derives it with "${TAG#v}", because expressions cannot strip a prefix.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -timeout 180s

      # rsrc_windows_amd64.syso carries the executable's icon. Regenerate it
      # so a stale file in the repository cannot ship the wrong icon.
      - name: Regenerate the executable icon
        run: go generate .

      # mygo.json names the version of the app and of the disk image, so it
      # follows the tag; the file stays at the last release for everyday builds.
      - name: Take the version from the tag
        shell: bash
        run: |
          VERSION="${TAG#v}"
          python -c "import json,sys; p='mygo.json'; c=json.load(open(p,encoding='utf-8')); c['version']=sys.argv[1]; open(p,'w',encoding='utf-8').write(json.dumps(c,indent=2,ensure_ascii=False)+'\n')" "$VERSION"
          grep '"version"' mygo.json

      - name: Build
        shell: bash
        run: |
          VERSION="${TAG#v}"
          # The updater needs the feed and the key that `mygo build` injects
          # from mygo.json, and production=1 — without it IsDev() is true and
          # the updater is disabled. This job builds with plain go, so that
          # the committed .syso keeps carrying the executable's icon, and
          # passes the same -X flags itself.
          PUBKEY=$(python -c "import json;print(json.load(open('mygo.json',encoding='utf-8'))['updates']['publicKey'])")
          REPO=$(python -c "import json;print(json.load(open('mygo.json',encoding='utf-8'))['updates']['github'])")
          FEED="https://github.com/${REPO}/releases/latest/download/update-windows-amd64.json"
          # -H windowsgui keeps the console window from appearing.
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=v${VERSION} -X github.com/egoist/mygo.production=1 -X github.com/egoist/mygo.packageUpdateFeed=${FEED} -X github.com/egoist/mygo.packageUpdateKey=${PUBKEY}" \
            -o "sshkeygate-${VERSION}-windows-amd64.exe" .
          ls -l *.exe

      # The archive the installed app downloads, signed with the key that
      # apps only accept updates from. Without the secret there is nothing to
      # sign it with, so the release goes out without in-place updates.
      - name: Sign the update archive
        shell: bash
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY:-}" ]; then
            echo "::warning::MYGO_UPDATER_PRIVATE_KEY is not set: publishing without an update archive"
            exit 0
          fi
          VERSION="${TAG#v}"
          mkdir -p updates
          go run ./tools/updatesign \
            -version "$VERSION" -target windows-amd64 \
            -exe "sshkeygate-${VERSION}-windows-amd64.exe" -name sshkeygate.exe \
            -tag "$TAG" -out updates
          ls -l updates

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sshkeygate-*-windows-amd64.exe
          if-no-files-found: error

      - name: Upload the update files
        uses: actions/upload-artifact@v4
        with:
          name: updates-windows
          path: updates/*
          if-no-files-found: ignore

  macos:
    name: macOS universal app
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -timeout 180s

      # mygo build names its disk image after mygo.json's version, so it has
      # to match the tag; the file stays at the last released version for
      # everyday builds.
      - name: Take the version from the tag
        shell: bash
        run: |
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import json, sys
          path = "mygo.json"
          with open(path, encoding="utf-8") as f:
              config = json.load(f)
          config["version"] = sys.argv[1]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          grep '"version"' mygo.json

      # mygo build compiles darwin/arm64 and darwin/amd64, merges them with
      # lipo, and wraps the result in a .app. -skip-dmg holds the disk image
      # back to after the shim, which the image has to contain.
      #
      # MYGO_LDFLAGS passes the version the app shows in its sidebar, and
      # -macos sets the deployment target: Go 1.27 links for macOS 13 by
      # default, which dyld refuses to load on 11 and 12 even when the plist
      # says 11.0.
      - name: Build the universal app
        env:
          MYGO_LDFLAGS: "-X main.version=${{ env.TAG }} -macos 11.0"
        run: |
          go run github.com/egoist/mygo/cmd/mygo@latest build \
            -platform darwin/universal -skip-notarize -skip-dmg

      # Go 1.27 imports SecTrustCopyCertificateChain, which macOS 12 added, so
      # the app cannot start on macOS 11 without the shim. It is built here,
      # where clang and lipo are, rather than cross-compiled.
      - name: Add the macOS 11 shim
        run: |
          chmod +x tools/sectrustcompat/macos11-compat.sh
          tools/sectrustcompat/macos11-compat.sh dist/darwin-universal/sshkeygate.app

      - name: Check the deployment target
        run: go run tools/machoinfo/main.go "dist/darwin-universal/sshkeygate.app/Contents/MacOS/sshkeygate.bin"

      - name: Check the shim
        run: |
          shim=dist/darwin-universal/sshkeygate.app/Contents/Frameworks/libsectrust_compat.dylib
          lipo -info "$shim"
          if [ -z "$(nm -g "$shim" | grep _SecTrustCopyCertificateChain || true)" ]; then
            echo "the shim does not export SecTrustCopyCertificateChain"
            exit 1
          fi
          if [ -n "$(nm -u "$shim" | grep _SecTrustCopyCertificateChain || true)" ]; then
            echo "the shim imports SecTrustCopyCertificateChain"
            exit 1
          fi

      # The launcher replaces the executable, so the bundle is signed again,
      # ad hoc: macOS refuses an unsigned bundle on Apple Silicon.
      - name: Sign the app
        run: |
          app=dist/darwin-universal/sshkeygate.app
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      # The update archive holds this bundle, after the shim and the
      # signature, so that installing an update keeps both. mygo build signs
      # an archive of what it assembled, which has neither, so this replaces
      # that archive with the released one.
      - name: Sign the update archive
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "${MYGO_UPDATER_PRIVATE_KEY:-}" ]; then
            echo "::warning::MYGO_UPDATER_PRIVATE_KEY is not set: publishing without an update archive"
            exit 0
          fi
          VERSION="${TAG#v}"
          mkdir -p updates
          go run ./tools/updatesign \
            -version "$VERSION" -target darwin-universal \
            -app dist/darwin-universal/sshkeygate.app \
            -tag "$TAG" -out updates
          ls -l updates

      # A disk image of the shimmed, signed app: mygo skipped it above, since
      # it would have held the app from before the shim.
      - name: Build the disk image
        run: |
          VERSION="${TAG#v}"
          stage=$(mktemp -d)
          cp -R dist/darwin-universal/sshkeygate.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "sshkeygate" -srcfolder "$stage" \
            -ov -format UDZO "dist/sshkeygate-${VERSION}.dmg"
          rm -rf "$stage"
          ls -lh "dist/sshkeygate-${VERSION}.dmg"

      - name: Collect
        run: |
          mkdir -p out
          cp dist/*.dmg out/
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

      - name: Upload the update files
        uses: actions/upload-artifact@v4
        with:
          name: updates-macos
          path: updates/*
          if-no-files-found: ignore

  publish:
    name: Publish the release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # A disk image keeps its directory when the artifact is unzipped, so
      # the assets are gathered into one flat directory first: gh refuses a
      # directory among the files to upload. The update archives and their
      # manifests go with them, which is what installed apps download.
      - name: Gather the assets
        run: |
          mkdir -p assets
          find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' -o -name 'update-*.json' \) -exec cp {} assets/ \;
          ls -l assets

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatch runs on a branch, so the tag may need creating.
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          gh release create "$TAG" assets/* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
